[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-medical"
version = "0.1.1"
description = "SMF Praxis Medical vertical — Medical Office compliance pack (private, commercial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Commercial — SMF Works. All rights reserved." }
authors = [{ name = "SMF Works", email = "liam@smfworks.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]
dependencies = [
    "praxis-agent>=0.29.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]

[project.entry-points."praxis.verticals"]
medical = "hybridagent_praxis_medical:register"

[tool.setuptools.packages.find]
include = ["hybridagent_praxis_medical*"]

[tool.setuptools.package-data]
"hybridagent_praxis_medical" = [
    "packs/*/pack.json",
    "packs/*/knowledge.md",
    "personas/*/authority.py",
    "web/*.css",
    "web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]